<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sign in . Internship Tracker</title>
        
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
        <link rel="stylesheet" href="../../style.css">
        <link rel="stylesheet" href="../auth.css">
    </head>
    <body class="auth-body">

        <!-- this is the card that everything will exist on -->
        <main class="auth-card">

            <!-- this will show the name and logo on the pages -->
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">
                    <span></span><span></span><span></span><span></span>
                </span>
                Internship Tracker
            </div>

                <!-- Sign in page -->
                <h1 class="auth-title">Sign in</h1>
                <p class="auth-sub">Pick up where you left off on your applications.</p>

                <!-- This area allows for a form to be submitted to adhere to sign in or create account -->
                <form id="login-form" class="auth-form">

                    <!-- username part of the form -->
                    <div class="field">
                        <label class="label" for="login-username">Username</label>
                        <input class="input" id="login-username" name="username" type="text"
                            autocomplete="username" required autofocus>
                    </div>

                    <!-- password part of the form -->
                    <div class="field">
                        <div class="label-row">
                            <label class = "label" for="login-password">Password</label>
                            <a class="link small" href="../reset_page/reset.html">Forgot password</a>
                        </div>
                        <input class="input" id="login-password" name="password" type="password"
                                autocomplete="current-password" required>
                    </div>
                    
                    <!-- this is going to be a placeholder until i implement an error from login.js -->
                    <p id="login-error" class="msg msg-error" role="alert" hidden></p>

                    <button class="btn btn-primary" type="submit">Sign in</button>

                </form>

                <!-- This is the bottom of the page so its just a divider line -->
                <div class="card-foot">
                    <p>New here? <a class="link" href="../signup_page/signup.html">Create an account here</a></p>
                    <p class="demo">Demo account: <code class="chip">demo</code> <code class="chip">demo1234</code></p>
                </div>

        </main>
        <script src="login.js" defer></script>
    </body>

</html>
