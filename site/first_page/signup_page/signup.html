<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Create an Account . Internship Tracker</title>
        
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
        <link rel="stylesheet" href="../../style.css">
        <link rel="stylesheet" href="../auth.css">
    </head>
    <body class="auth-body">

        <!-- this is the card that everything will exist on -->
        <main class="auth-card">

            <!-- this will show the name and logo on the pages -->
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">
                    <span></span><span></span><span></span><span></span>
                </span>
                Internship Tracker
            </div>
                <div id="signup-step">
                    <!--text to show create account text-->
                    <h1 class = "auth-title">
                        Create a new account
                    </h1>
                </div>

            <form id="signup-form" class="auth-form">
                <div class="feild">
                    <!-- adds the username text-->
                    <label class="label" form="signup-username">
                        Username
                    </label>
                    <input class="input" id="signup-username" name="username" type="text"
                        autocomplete="username" required
                        pattern="[A-Za-z0-9\-]{3,30}" maxlength="30"
                        title="3 to 30 characters: letters, numbers and dashes"
                        aria-describedby="signup-username-hint">
                    <span class="hint" id="signup-username-hint">
                        3-30 characters: letters, numbers, and dashes.
                </span>
                </div>
            </form>
                

        </main>
        <script src="signup.js" defer></script>
    </body>

</html>
